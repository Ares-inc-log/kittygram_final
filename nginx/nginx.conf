server {
    listen 80;
    server_name kittysen.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name kittysen.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/kittysen.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kittysen.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:9000/api/;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:9000/admin/;
    }

    location /media/ {
        alias /media/;
    }

    location / {
        root /static/;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}


server {
    listen 80;
    server_name add.myftp.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name add.myftp.org;

    ssl_certificate /etc/letsencrypt/live/add.myftp.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/add.myftp.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://taski-backend:8000/api/;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://taski-backend:8000/admin/;
    }

    location / {
        alias /taski_static/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
