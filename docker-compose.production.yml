volumes:
  pg_data:
  static:

services:
  db:
    image: postgres:13
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    image: haziko/kittygram_backend:latest
    env_file: .env
    volumes:
      - static:/backend_static
  frontend:
    env_file: .env
    image: haziko/kittygram_frontend:latest
    command: cp -r /app/build/. /static/
    volumes:
      - static:/static
  nginx:
    image: haziko/kittygram_nginx:latest
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static:/static
      - /etc/letsencrypt/:/etc/letsencrypt/:ro
    depends_on:
      - backend


