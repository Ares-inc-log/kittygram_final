volumes:
  pg_data:
  static:
  media:
  taski_static:
    external: true
    name: taski_static_volume

services:
  db:
    image: postgres:13
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - kitty_net

  backend:
    image: haziko/kittygram_backend:latest
    restart: always
    env_file: .env
    volumes:
      - static:/backend_static
      - media:/app/media
    depends_on:
      - db
    networks:
      - kitty_net

  frontend:
    env_file: .env
    image: haziko/kittygram_frontend:latest
    command: cp -r /app/build/. /static/
    volumes:
      - static:/static
    networks:
      - kitty_net

  nginx:
    image: haziko/kittygram_nginx:latest
    restart: always
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static:/static
      - media:/media
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - taski_static:/taski_static:ro
    depends_on:
      - backend
    networks:
      - kitty_net
      - web

networks:
  kitty_net:
    driver: bridge
  web:
    external: true
