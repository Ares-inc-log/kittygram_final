volumes:
  pg_data:
  static:

services:
  db:
    image: postgres:13
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    build: ./backend/
    env_file: .env
    volumes:
      - static:/backend_static
  frontend:
    env_file: .env
    build: ./frontend/
    command: cp -r /app/build/. /static/
    volumes:
      - static:/static
  gateway:
    build: ./gateway/
    env_file: .env
    ports:
      - 9000:80
    volumes:
      - static:/static
  step:
    uses: appleboy/ssh-action@v1.0.0
    env:
      DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DB_HOST: ${{ secrets.DB_HOST }}
    with:
      host: ${{ secrets.HOST }}
      username: ${{ secrets.USER }}
      key: ${{ secrets.SSH_KEY }
      envs: DB_PASSWORD,SECRET_KEY,DB_HOST
      script: |
        cd /home/ubuntu/kittygram/

        echo "DB_PASSWORD=${POSTGRES_PASSWORD}" > .env
        echo "SECRET_KEY=${SECRET_KEY}" >> .env
        echo "DB_HOST=${DB_HOST}" >> .env

        docker compose down
        docker compose up -d --build

